apiVersion: infra.k8smgmt.io/v3
kind: Cluster
metadata:
  labels:
    test: test1
  name: vijayseks300326-1
  project: defaultproject
spec:
  blueprintConfig:
    name: custombp
    version: 4.0.0
  cloudCredentials: vijaysrole
  config:
    addons:
    - name: coredns
      version: latest
    - name: kube-proxy
      version: latest
    - name: vpc-cni
      version: latest
    - name: aws-ebs-csi-driver
      version: latest
    - name: aws-efs-csi-driver
      version: v2.3.1-eksbuild.1
      wellKnownPolicies:
        efsCSIController: true
    iam:
      withOIDC: true
    managedNodeGroups:
    - ami: ami-000037bec3bcf510e
      desiredCapacity: 1
      instanceType: t3.xlarge
      maxSize: 1
      minSize: 1
      name: al2023-3
      overrideBootstrapCommand: |
        [AmazonLinux2023]
      preBootstrapCommands:
      - ls -ld /etc/kubernetes/kubelet/config.json.d > /dev/null 2>&1 || mkdir -p
        /etc/kubernetes/kubelet/config.json.d
      - |
        echo '{
        "apiVersion": "kubelet.config.k8s.io/v1beta1",
        "kind": "KubeletConfiguration",
        "evictionHard": {
           "memory.available": "1234Mi",
           "nodefs.available": "12%",
           "nodefs.inodesFree": "11%",
           "imagefs.available": "10%",
           "imagefs.inodesFree": "9%"
           }
         }' > /etc/kubernetes/kubelet/config.json.d/50-custom-kubelet.conf
      privateNetworking: false
      tags:
        email: vijaysamanthapuri@rafay.co
        env: cs-demo
      volumeSize: 100
      volumetype: gp3
    - ami: ami-000037bec3bcf510e
      desiredCapacity: 1
      instanceType: t3.xlarge
      maxSize: 1
      minSize: 1
      name: al2023-1
      overrideBootstrapCommand: |
        [AmazonLinux2023]
      preBootstrapCommands:
      - ls -ld /etc/kubernetes/kubelet/config.json.d > /dev/null 2>&1 || mkdir -p
        /etc/kubernetes/kubelet/config.json.d
      - |
        echo '{
                "apiVersion": "kubelet.config.k8s.io/v1beta1",
                "kind": "KubeletConfiguration",
                 "evictionHard": {
                    "memory.available": "100Mi",
                    "nodefs.available": "10%",
                    "nodefs.inodesFree": "5%",
                    "imagefs.available": "15%",
                    "imagefs.inodesFree": "5%"
                }
              }' > /etc/kubernetes/kubelet/config.json.d/50-custom-kubelet.conf
      privateNetworking: false
      tags:
        email: vijaysamanthapuri@rafay.co
        env: cs-demo
      volumeSize: 100
      volumetype: gp3
    - ami: ami-000037bec3bcf510e
      desiredCapacity: 1
      instanceType: t3.xlarge
      maxSize: 2
      minSize: 0
      name: al2023
      overrideBootstrapCommand: |
        [AmazonLinux2023]
      preBootstrapCommands:
      - echo hi
      privateNetworking: false
      tags:
        email: vijaysamanthapuri@rafay.co
        env: cs-demo
      volumeSize: 100
      volumetype: gp3
    - amiFamily: Bottlerocket
      desiredCapacity: 1
      iam:
        withAddonPolicies:
          autoScaler: true
          imageBuilder: true
      instanceTypes:
      - t3.xlarge
      maxSize: 2
      minSize: 0
      name: bottlerocket-ng
      tags:
        email: vijaysamanthapuri@rafay.co
        env: cs-team
      volumeSize: 80
      volumeType: gp3
    metadata:
      name: vijayseks300326-1
      region: us-west-2
      tags:
        email: vijaysamanthapuri@rafay.co
        env: cs-demo
      version: "1.33"
    network:
      cni:
        name: aws-cni
    vpc:
      autoAllocateIPv6: false
      cidr: 192.168.0.0/16
      clusterEndpoints:
        privateAccess: true
        publicAccess: true
      nat:
        gateway: Single
  type: aws-eks
